# @package _global_

defaults:
- /data@data: tiger_prefix_trace
- /model@model: tiger_prefix_trace
- /callbacks@callbacks: tiger_prefix_trace
- /logger@logger: tiger_prefix_trace
- /trainer@trainer: tiger_inference

data_dir: ???
display_dataset_name: ${oc.select:dataset_name,${dataset_slug:${data_dir}}}
data_split: ???
semantic_id_path: ???
ckpt_path: ???
checkpoint_reference: null
num_hierarchies: 4
codebook_size: 256
beam_width: 10
devices: ???

run_mode: inference
task_name: tiger_prefix_trace
run_display_name: tiger_${display_dataset_name}_seed${seed}_${sid_type}_prefix_trace_analysis
