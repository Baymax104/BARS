# @package _global_

defaults:
- /data@data: sem_embeds_inference
- /model@model: sem_embeds_inference
- /callbacks@callbacks: sem_embeds_inference
- /logger@logger: sem_embeds_inference
- /trainer@trainer: sem_embeds_inference

data_dir: ???
display_dataset_name: ${oc.select:dataset_name,${dataset_slug:${data_dir}}}
devices: ???

embedding_model: ${paths.pretrained_models_dir}/flan-t5-large
run_mode: inference
task_name: sem_embeds_inference
run_display_name: sem_embeds_${display_dataset_name}_seed${seed}_semantic_embedding_export
project: GRID
user: baymaxam
group: sem_embeds_main
id: ${now_tz:%Y-%m-%d}/${now_tz:%H-%M-%S}
ckpt_path: null
seed: 42
paths:
  root_dir: .
  data_dir: ${data_dir}
  log_dir: ${paths.root_dir}/logs
  output_dir: ${hydra:runtime.output_dir}
  work_dir: ${hydra:runtime.cwd}
  profile_dir: ${hydra:run.dir}/profile_output
  metadata_dir: ${paths.output_dir}/metadata
extras:
  ignore_warnings: false
  print_config_warnings: true
  print_config: false
