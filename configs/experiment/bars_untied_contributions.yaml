# @package _global_
defaults:
- liger_inference
- override /data@data: bars_diagnosis
- override /model@model: bars_untied_contributions
- override /callbacks@callbacks: bars_untied_mechanism
- _self_
run_mode: analysis
analysis_kind: contributions
evidence_phase: mechanism
analysis_source_variant: untied_fixed_alpha_half_no_mixture
m3_protocol: ${model.analysis_source_contracts.${analysis_source_variant}.protocol}
group: mechanism_main
task_name: bars_untied_${dataset_name}_seed${seed}_${analysis_kind}
run_display_name: bars_v2_${dataset_name}_seed${seed}_${analysis_source_variant}_${analysis_kind}_analysis
ckpt_path: null
checkpoint_reference: ${ckpt_path}
checkpoint_sha256: null
prediction_paths:
  # 新匹配对照完成并获准 Testing 后，以 +prediction_paths.<condition> 显式加入。
  untied: wandb://baymaxam/GRID/prt5r0v5?role=recommendation_output&alias=v0&file=merged_predictions_tensor.pt
prediction_sha256s:
  untied: 7bd54d23e33b6b89b4d7de568f030172819293417fd5f74a4fc39a5ca1097065
trainer:
  root:
    accelerator: cpu
    devices: 1
source_snapshot:
  enabled: true
logger:
  wandb:
    notes: 来源=${analysis_source_variant}；Beauty42冻结预测配对贡献，须显式提供匹配对照URI与SHA；0模型forward；用户区间不代表训练seed不确定性。
    tags: [bars, untied, mechanism, contributions, beauty42]
