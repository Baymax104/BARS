# @package _global_
defaults:
- copmrec_train
- override /model@model: copmrec_ablation
- _self_
ablation_variant: ???
group: ${bars_ablation_display.${ablation_variant}.group}
task_name: copmrec_v2_${dataset_name}_seed${seed}_${ablation_variant}_train
run_display_name: bars_v2_${dataset_name}_seed${seed}_${bars_ablation_display.${ablation_variant}.name}_train
evidence_phase: ablation
m3_protocol: ${model.ablation_protocol.${ablation_variant}}
alpha_policy: ${model.ablation_alpha.${ablation_variant}.policy}
fixed_mixture_alpha: ${model.ablation_alpha.${ablation_variant}.fixed_mixture_alpha}
residual_sharing: ${model.ablation_residual.${ablation_variant}.sharing}
residual_table_count: ${model.ablation_residual.${ablation_variant}.table_count}
residual_comparison_protocol: ${model.ablation_residual.${ablation_variant}.comparison_protocol}
formal_release:
  evidence_phase: ablation
  variant: ${ablation_variant}
  m3_protocol: ${m3_protocol}
logger:
  wandb:
    notes: M3 固定单元实证；独立 scratch；登记观测值。
    tags:
    - copmrec-v2
    - ablation
    - train
    - ${ablation_variant}
callbacks:
  wandb_checkpoint_writer:
    metadata:
      m3_protocol: ${m3_protocol}
      ablation_variant: ${ablation_variant}
      alpha_policy: ${alpha_policy}
      fixed_mixture_alpha: ${fixed_mixture_alpha}
      residual_sharing: ${residual_sharing}
      residual_table_count: ${residual_table_count}
      residual_comparison_protocol: ${residual_comparison_protocol}
      validation_selection_mode: ${model.root.validation_selection_mode}
      validation_generation_candidates: ${model.root.generation_candidates}
training_objective:
  sid_ce: 1.0
  joint_catalog_ce: ${model.ablation_weights.${ablation_variant}.joint_catalog_ce}
  mixture_nll: ${model.ablation_weights.${ablation_variant}.mixture_nll}
  native_view_ce: 0.0
  native_view_computed: false
