# @package _global_
root:
  _target_: src.recommendation.intrr.module.IntrrRecommender
  catalog: ${data.catalog}
  sequence_length: ${sequence_length}
  num_hierarchies: ${num_hierarchies}
  codebook_size: ${codebook_size}
  embedding_dim: 256
  item_embedding_dim: 512
  ran_hidden_dim: 512
  num_layers: 4
  num_heads: 6
  d_kv: 64
  feedforward_dim: 1024
  feedforward_hidden_layers: 2
  dropout: 0.15
  temperature: 1.0
  alignment_weight: 0.1
  top_k_for_generation: 10
  should_check_prefix: true
  training_model_config: ${model.training_model_config}

# 通用优化与指标对齐 TIGER；由 compose 深比较测试约束。
training_model_config:
  _target_: src.common.configs.model.TrainingModelConfig
  loss_function:
    _target_: torch.nn.CrossEntropyLoss
    ignore_index: -1
  optimizer:
    _target_: torch.optim.Adam
    _partial_: true
    lr: 0.0005
    weight_decay: 0.000001
  scheduler: null

metrics:
  _target_: src.common.metrics.MetricEngine
  stages:
    train:
      loss:
        metric:
          _target_: torchmetrics.MeanMetric
        spec:
          key: loss
    val: &ranking
      loss:
        metric:
          _target_: torchmetrics.MeanMetric
        spec:
          key: loss
      ndcg@5:
        metric:
          _target_: src.recommendation.tiger.metrics.NDCG
          top_k: 5
          sync_on_compute: false
          compute_with_cache: false
        spec:
          adapter:
            _target_: src.recommendation.tiger.metrics.sid_retrieval_inputs
            _partial_: true
      ndcg@10:
        metric:
          _target_: src.recommendation.tiger.metrics.NDCG
          top_k: 10
          sync_on_compute: false
          compute_with_cache: false
        spec:
          adapter:
            _target_: src.recommendation.tiger.metrics.sid_retrieval_inputs
            _partial_: true
      recall@5:
        metric:
          _target_: src.recommendation.tiger.metrics.Recall
          top_k: 5
          sync_on_compute: false
          compute_with_cache: false
        spec:
          adapter:
            _target_: src.recommendation.tiger.metrics.sid_retrieval_inputs
            _partial_: true
      recall@10:
        metric:
          _target_: src.recommendation.tiger.metrics.Recall
          top_k: 10
          sync_on_compute: false
          compute_with_cache: false
        spec:
          adapter:
            _target_: src.recommendation.tiger.metrics.sid_retrieval_inputs
            _partial_: true
    test: *ranking
